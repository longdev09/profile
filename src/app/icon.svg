<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b8b"/>
      <stop offset="50%" stop-color="#f11c65"/>
      <stop offset="100%" stop-color="#d80048"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#700020" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Main Wedding Heart Graphic -->
  <g filter="url(#shadow)">
    <!-- Symmetric Heart Path -->
    <path d="M 256 430 C 200 380 100 290 100 190 C 100 125 150 80 212 80 C 238 80 250 98 256 130 C 262 98 274 80 300 80 C 362 80 412 125 412 190 C 412 290 312 380 256 430 Z" fill="url(#heartGrad)"/>
    
    <!-- Play icon cut-out inside heart (representing Slide/Video Cưới) -->
    <path d="M 236 205 C 236 200 242 196 247 199 L 297 234 C 301 237 301 243 297 246 L 247 281 C 242 284 236 280 236 275 Z" fill="#f11c65"/>
    
    <!-- Wedding Sparkles / Stars -->
    <path d="M 370 115 L 374 127 L 386 131 L 374 135 L 370 147 L 366 135 L 354 131 L 366 127 Z" fill="#ffd700"/>
    <path d="M 150 140 L 153 148 L 161 151 L 153 154 L 150 162 L 147 154 L 139 151 L 147 148 Z" fill="#ffd700"/>
  </g>
</svg>
